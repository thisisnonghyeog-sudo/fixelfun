<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카드 뒤집기 - PixelFun</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .memory-game {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
      padding: 1rem;
    }
    .memory-game h1 {
      font-family: 'Press Start 2P', cursive;
      color: var(--neon-blue);
      text-shadow: 0 0 12px var(--neon-blue);
      font-size: 1.3rem;
      margin-bottom: 1rem;
    }
    .intro-screen, .result-screen {
      background: var(--bg-card);
      border: 2px solid var(--neon-blue);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }
    .intro-screen p { color: var(--text-secondary); margin: 0.5rem 0; line-height: 1.6; }
    .top-bar {
      display: flex;
      justify-content: space-around;
      margin-bottom: 1rem;
      background: var(--bg-card);
      border-radius: 8px;
      padding: 0.8rem;
      border: 1px solid var(--neon-blue);
    }
    .top-bar div { color: var(--text-secondary); font-size: 0.9rem; }
    .top-bar strong { display: block; color: var(--neon-yellow); font-size: 1.3rem; margin-top: 0.2rem; font-family: 'Press Start 2P', cursive; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin: 1rem 0;
    }
    .card {
      aspect-ratio: 1;
      background: var(--bg-card);
      border: 2px solid var(--neon-purple);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      transform-style: preserve-3d;
    }
    .card .face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      border-radius: 10px;
    }
    .card .back {
      background: linear-gradient(135deg, var(--neon-purple), var(--bg-hover));
      color: var(--neon-yellow);
      font-family: 'Press Start 2P', cursive;
      font-size: 1.2rem;
    }
    .card .front {
      transform: rotateY(180deg);
      background: var(--bg-main);
      color: var(--neon-yellow);
    }
    .card.flipped { transform: rotateY(180deg); box-shadow: 0 0 15px var(--neon-blue); }
    .card.matched {
      transform: rotateY(180deg);
      border-color: var(--neon-green);
      box-shadow: 0 0 18px var(--neon-green);
    }
    .card.matched .front { color: var(--neon-green); }
    .button-row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
    .new-record {
      color: var(--neon-yellow);
      font-family: 'Press Start 2P', cursive;
      font-size: 1rem;
      margin: 1rem 0;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.5; } }
    .hidden { display: none; }
    @media (max-width: 480px) {
      .card-grid { gap: 0.4rem; }
      .card { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <nav class="game-nav">
    <a href="../index.html">← 홈으로</a>
    <span class="game-title">카드 뒤집기</span>
  </nav>

  <main class="game-container">
    <div class="memory-game">
      <h1>MEMORY MATCH</h1>

      <!-- 시작 화면 -->
      <div id="introScreen" class="intro-screen">
        <p>4×4 = 16장의 카드 중 같은 그림 8쌍을 모두 찾으세요!</p>
        <p>두 장 뒤집어 일치하면 유지, 다르면 다시 닫혀요.</p>
        <p>모든 짝을 가장 빠르게 맞춰보세요.</p>
        <p>최고기록: <strong id="bestRecord" style="color:var(--neon-yellow)">-</strong> 초</p>
        <button class="btn-primary" id="startBtn">게임 시작</button>
      </div>

      <!-- 플레이 화면 -->
      <div id="playScreen" class="hidden">
        <div class="top-bar">
          <div>시간<strong id="timeView">0.0</strong></div>
          <div>매칭<strong id="matchView">0 / 8</strong></div>
          <div>이동<strong id="moveView">0</strong></div>
        </div>
        <div class="card-grid" id="cardGrid"></div>
      </div>

      <!-- 결과 화면 -->
      <div id="resultScreen" class="result-screen hidden">
        <h2 style="color:var(--neon-green); font-family:'Press Start 2P', cursive; font-size:1.2rem">🎉 클리어!</h2>
        <p style="color:var(--text-secondary); margin-top:1rem">소요 시간: <strong style="color:var(--neon-blue)" id="finalTime">0.0</strong> 초</p>
        <p style="color:var(--text-secondary); margin-top:0.5rem">총 이동: <strong style="color:var(--neon-yellow)" id="finalMove">0</strong> 회</p>
        <div id="newRecordMsg" class="new-record hidden">🏆 신기록 달성!</div>
        <p style="color:var(--text-secondary); margin-top:0.8rem">최고기록: <strong style="color:var(--neon-yellow)" id="finalBest">-</strong> 초</p>
        <div class="button-row">
          <button class="btn-primary" id="retryBtn">다시하기</button>
          <a href="../index.html" class="btn-secondary">홈으로</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Supabase (로그인 + 랭킹 DB) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/supabase-config.js" defer></script>

  <script src="../js/sound.js" defer></script>
  <script src="../js/i18n.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/stats.js" defer></script>
  <script src="../js/badge.js" defer></script>
  <script src="../js/ranking.js" defer></script>
  <script src="../js/cloud-sync.js" defer></script>
  <script>
    (function() {
      const STORAGE_KEY = 'pixelfun_memory_best';
      const EMOJIS = ['🎮','🎯','🎲','🎨','🎭','🎪','🎢','🎡'];

      const introScreen = document.getElementById('introScreen');
      const playScreen = document.getElementById('playScreen');
      const resultScreen = document.getElementById('resultScreen');
      const startBtn = document.getElementById('startBtn');
      const retryBtn = document.getElementById('retryBtn');
      const cardGrid = document.getElementById('cardGrid');
      const timeView = document.getElementById('timeView');
      const matchView = document.getElementById('matchView');
      const moveView = document.getElementById('moveView');
      const bestRecord = document.getElementById('bestRecord');
      const finalTime = document.getElementById('finalTime');
      const finalMove = document.getElementById('finalMove');
      const finalBest = document.getElementById('finalBest');
      const newRecordMsg = document.getElementById('newRecordMsg');

      let cards = [];
      let firstPick = null;
      let lock = false;
      let matched = 0;
      let moves = 0;
      let startTime = 0;
      let timerId = null;

      function getBest() {
        const v = localStorage.getItem(STORAGE_KEY);
        return v ? parseFloat(v) : null;
      }
      function setBest(v) { localStorage.setItem(STORAGE_KEY, v.toFixed(1)); }
      function showBest() {
        const b = getBest();
        bestRecord.textContent = b ? b.toFixed(1) : '-';
      }

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function buildBoard() {
        const deck = shuffle([...EMOJIS, ...EMOJIS]);
        cardGrid.innerHTML = '';
        cards = deck.map((emoji, i) => {
          const div = document.createElement('div');
          div.className = 'card';
          div.dataset.idx = i;
          div.dataset.emoji = emoji;
          div.innerHTML = '<div class="face back">?</div><div class="face front">' + emoji + '</div>';
          div.addEventListener('click', () => onCardClick(div));
          cardGrid.appendChild(div);
          return div;
        });
      }

      function onCardClick(card) {
        if (lock) return;
        if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
        card.classList.add('flipped');
        if (window.PixelSound) PixelSound.play('flip');
        if (!firstPick) {
          firstPick = card;
          return;
        }
        moves++;
        moveView.textContent = moves;
        if (firstPick.dataset.emoji === card.dataset.emoji) {
          firstPick.classList.add('matched');
          card.classList.add('matched');
          firstPick = null;
          matched++;
          matchView.textContent = matched + ' / 8';
          if (window.PixelSound) PixelSound.play('success');
          if (matched === 8) endGame();
        } else {
          lock = true;
          const a = firstPick, b = card;
          firstPick = null;
          setTimeout(() => {
            a.classList.remove('flipped');
            b.classList.remove('flipped');
            lock = false;
          }, 800);
          if (window.PixelSound) PixelSound.play('fail');
        }
      }

      function tickTimer() {
        const t = (Date.now() - startTime) / 1000;
        timeView.textContent = t.toFixed(1);
      }

      function startGame() {
        introScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        playScreen.classList.remove('hidden');
        firstPick = null;
        lock = false;
        matched = 0;
        moves = 0;
        matchView.textContent = '0 / 8';
        moveView.textContent = '0';
        timeView.textContent = '0.0';
        buildBoard();
        startTime = Date.now();
        if (timerId) clearInterval(timerId);
        timerId = setInterval(tickTimer, 100);
        if (window.PixelSound) PixelSound.play('start');
      }

      function endGame() {
        clearInterval(timerId);
        const elapsed = (Date.now() - startTime) / 1000;
        const best = getBest();
        const isNewRecord = !best || elapsed < best;
        if (isNewRecord) setBest(elapsed);
        setTimeout(() => {
          playScreen.classList.add('hidden');
          resultScreen.classList.remove('hidden');
          finalTime.textContent = elapsed.toFixed(1);
          finalMove.textContent = moves;
          finalBest.textContent = getBest().toFixed(1);
          newRecordMsg.classList.toggle('hidden', !isNewRecord);
          if (window.PixelSound) PixelSound.play('clear');

          window.dispatchEvent(new CustomEvent('gameComplete', {
            detail: { game: 'memory', score: parseFloat(elapsed.toFixed(1)), isNewRecord: isNewRecord }
          }));
        }, 600);
      }

      startBtn.addEventListener('click', startGame);
      retryBtn.addEventListener('click', startGame);
      showBest();
    })();
  </script>
</body>
</html>
